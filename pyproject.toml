[project]
name = "media-sorter"
version = "0.1.0"
description = "Sort torrented movies and series into a media library using a local Ollama model"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["ollama>=0.4.0", "rich>=13.0"]

[project.scripts]
media-sorter = "media_sorter:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
