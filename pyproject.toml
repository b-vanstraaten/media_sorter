[project]
name = "marquee"
version = "0.3.1"
description = "Sort torrented movies and series into a media library using a local Ollama model"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Barnaby van Straaten", email = "barnaby.vanstraaten@ionq.co"}]
homepage = "https://github.com/b-vanstraaten/marquee"
repository = "https://github.com/b-vanstraaten/marquee"
keywords = ["media", "organization", "ollama", "ai", "torrent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.9"
dependencies = ["ollama>=0.4.0", "rich>=13.0"]

[project.scripts]
marquee = "marquee:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
